name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    env:
      APP_NAME: PersonalAccounting
      BUNDLE_ID: org.openaiuser.personalaccounting
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode 16.4 and record environment
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          python3 --version

          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
            echo "macOS=$(sw_vers -productVersion)"
            echo "Xcode=$(xcodebuild -version | paste -sd ' ' -)"
            echo "host Python=$(python3 --version 2>&1)"
            echo "kivy-ios=2025.5.17"
            echo "target platform=iphoneos-arm64"
            echo "SDK=iphoneos"
            echo "bundle id=${BUNDLE_ID}"
            echo "configuration=Release"
          } > build-info.txt

      - name: Install host build tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config ccache
          python3 -m venv ios-venv
          source ios-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "kivy-ios==2025.5.17"
          python -m pip install "Cython==3.0.11"
          python -m pip show kivy-ios Cython

      - name: Record toolchain CLI and recipe versions
        shell: bash
        run: |
          set -euo pipefail
          source ios-venv/bin/activate
          export PATH="$(brew --prefix libtool)/libexec/gnubin:$(brew --prefix ccache)/libexec:${PATH}"

          toolchain --help 2>&1 | tee toolchain-help.txt
          toolchain build --help 2>&1 | tee toolchain-build-help.txt
          toolchain recipes 2>&1 | tee recipe-versions.txt

          grep -F -- "--platform" toolchain-build-help.txt
          grep -F -- "iphoneos-arm64" recipe-versions.txt toolchain-build-help.txt toolchain-help.txt || true

          {
            echo "target Python recipe=$(awk '$1 == \"python3\" {print $2; exit}' recipe-versions.txt)"
            echo "Kivy recipe=$(awk '$1 == \"kivy\" {print $2; exit}' recipe-versions.txt)"
            echo "device parameter=--platform iphoneos-arm64"
          } >> build-info.txt

      - name: Build device-only Python and Kivy recipes
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          source ios-venv/bin/activate
          export PATH="$(brew --prefix libtool)/libexec/gnubin:$(brew --prefix ccache)/libexec:${PATH}"

          started_at=$(date +%s)
          {
            echo "+ toolchain build hostpython3"
            toolchain build hostpython3
            echo "+ toolchain build python3 kivy --platform iphoneos-arm64"
            toolchain build python3 kivy --platform iphoneos-arm64
          } 2>&1 | tee recipe-build.log
          elapsed=$(( $(date +%s) - started_at ))
          echo "recipe duration seconds=${elapsed}" >> build-info.txt

      - name: Prepare minimal app source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios-app-source
          mkdir ios-app-source
          cp main.py NotoSerifSC-Regular.otf ios-app-source/

          test -f ios-app-source/main.py
          test -f ios-app-source/NotoSerifSC-Regular.otf
          ls -lah ios-app-source

      - name: Create and configure Xcode project
        shell: bash
        run: |
          set -euo pipefail
          source ios-venv/bin/activate
          export PATH="$(brew --prefix libtool)/libexec/gnubin:$(brew --prefix ccache)/libexec:${PATH}"

          app_source="$(pwd)/ios-app-source"
          toolchain create "${APP_NAME}" "${app_source}"

          project_path="$(find . -maxdepth 3 -type d -name '*.xcodeproj' -print -quit)"
          if [[ -z "${project_path}" ]]; then
            echo "No generated .xcodeproj was found." >&2
            exit 1
          fi
          project_path="${project_path#./}"
          project_dir="$(dirname "${project_path}")"
          info_plist="$(find "${project_dir}" -maxdepth 1 -type f -name '*-Info.plist' -print -quit)"
          if [[ -z "${info_plist}" ]]; then
            echo "No generated Info.plist was found." >&2
            exit 1
          fi

          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier $(PRODUCT_BUNDLE_IDENTIFIER)' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString $(MARKETING_VERSION)' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion $(CURRENT_PROJECT_VERSION)' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations~ipad' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad array' "${info_plist}"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait' "${info_plist}"

          find "${project_dir}" -maxdepth 2 -type f | sort | sed -n '1,100p'
          xcodebuild -project "${project_path}" -list -json | tee xcode-project.json
          scheme="$(python -c 'import json; data=json.load(open("xcode-project.json")); print(data["project"]["schemes"][0])')"
          if [[ -z "${scheme}" ]]; then
            echo "No Xcode scheme was found." >&2
            exit 1
          fi

          {
            echo "PROJECT_PATH=${project_path}"
            echo "PROJECT_DIR=${project_dir}"
            echo "INFO_PLIST=${info_plist}"
            echo "SCHEME=${scheme}"
          } >> "${GITHUB_ENV}"

          {
            echo "project=${project_path}"
            echo "scheme=${scheme}"
            echo "orientation=$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "${info_plist}" | tr '\n' ' ')"
          } >> build-info.txt

      - name: Verify Xcode build settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            PRODUCT_NAME="${APP_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION}" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings | tee build-settings.txt

          actual_bundle_id="$(awk -F ' = ' '/PRODUCT_BUNDLE_IDENTIFIER = / {print $2; exit}' build-settings.txt)"
          test "${actual_bundle_id}" = "${BUNDLE_ID}"
          grep -F 'SDKROOT = iphoneos' build-settings.txt
          echo "resolved bundle id=${actual_bundle_id}" >> build-info.txt

      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          started_at=$(date +%s)
          xcodebuild \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            PRODUCT_NAME="${APP_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION}" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          elapsed=$(( $(date +%s) - started_at ))
          echo "xcodebuild duration seconds=${elapsed}" >> build-info.txt

      - name: Validate device app and unsigned state
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "No Release-iphoneos .app was found." >&2
            exit 1
          fi
          case "${app_path}" in
            *Release-iphoneos/*.app) ;;
            *) echo "Unexpected non-device app path: ${app_path}" >&2; exit 1 ;;
          esac

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Info.plist")"
          executable_path="${app_path}/${executable_name}"
          test -x "${executable_path}"

          file "${executable_path}" | tee executable-file.txt
          lipo -info "${executable_path}" | tee executable-lipo.txt
          xcrun vtool -show-build "${executable_path}" | tee executable-platform.txt
          grep -q 'arm64' executable-file.txt executable-lipo.txt
          grep -q 'platform IOS' executable-platform.txt

          font_path="$(find "${app_path}" -type f -name 'NotoSerifSC-Regular.otf' -print -quit)"
          main_source="$(find "${app_path}" -type f \( -name 'main.py' -o -name 'main.pyc' \) -print -quit)"
          test -n "${font_path}"
          test -n "${main_source}"
          find "${app_path}" -maxdepth 3 -type f | sort | tee app-files.txt

          built_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")"
          test "${built_bundle_id}" = "${BUNDLE_ID}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:0' "${app_path}/Info.plist")" = "UIInterfaceOrientationPortrait"

          if codesign -dvvv "${app_path}" > codesign-status.txt 2>&1; then
            cat codesign-status.txt
            echo "The app is signed, but this workflow requires an unsigned app." >&2
            exit 1
          fi
          cat codesign-status.txt
          grep -q 'code object is not signed at all' codesign-status.txt

          {
            echo "app path=${app_path}"
            echo "executable=${executable_path}"
            echo "architecture=$(lipo -info "${executable_path}")"
            echo "platform=iphoneos device"
            echo "font path=${font_path}"
            echo "main source=${main_source}"
            echo "codesign=unsigned"
          } >> build-info.txt
          echo "APP_PATH=${app_path}" >> "${GITHUB_ENV}"

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ipa PersonalAccounting.app.zip PersonalAccounting-unsigned.ipa
          mkdir -p ipa/Payload
          cp -R "${APP_PATH}" "ipa/Payload/${APP_NAME}.app"
          ditto -c -k --keepParent "${APP_PATH}" PersonalAccounting.app.zip
          (
            cd ipa
            /usr/bin/zip -qry ../PersonalAccounting-unsigned.ipa Payload
          )

          unzip -l PersonalAccounting-unsigned.ipa | tee ipa-contents.txt | sed -n '1,100p'
          unzip -l PersonalAccounting-unsigned.ipa | grep -F "Payload/${APP_NAME}.app/"
          ipa_size="$(stat -f '%z' PersonalAccounting-unsigned.ipa)"
          ipa_sha256="$(shasum -a 256 PersonalAccounting-unsigned.ipa | awk '{print $1}')"
          ls -lh PersonalAccounting-unsigned.ipa PersonalAccounting.app.zip
          shasum -a 256 PersonalAccounting-unsigned.ipa

          {
            echo "IPA=PersonalAccounting-unsigned.ipa"
            echo "IPA size bytes=${ipa_size}"
            echo "IPA SHA256=${ipa_sha256}"
          } >> build-info.txt
          cat build-info.txt

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            PersonalAccounting-unsigned.ipa
            PersonalAccounting.app.zip
            build-info.txt
            recipe-build.log
            xcodebuild.log
            build-settings.txt
            xcode-project.json
            codesign-status.txt
            executable-file.txt
            executable-lipo.txt
            executable-platform.txt
            ipa-contents.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-${{ github.run_id }}
          path: |
            build-info.txt
            recipe-build.log
            xcodebuild.log
            build-settings.txt
            xcode-project.json
            toolchain-help.txt
            toolchain-build-help.txt
            recipe-versions.txt
          if-no-files-found: warn
          retention-days: 14
